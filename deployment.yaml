apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-ordering-system
  template:
    metadata:
      labels:
        app: food-ordering-system
    spec:
      containers:
        - name: food-ordering-system
          image: food-ordering-system:latest
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-system-service
spec:
  type: NodePort
  selector:
    app: food-ordering-system
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080