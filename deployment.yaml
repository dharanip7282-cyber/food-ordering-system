
apiVersion: batch/v1
kind: Job
metadata:
  name: food-ordering-system
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: food-ordering-system
    spec:
      restartPolicy: Never
      containers:
        - name: food-ordering-system
          image: surxverse/food-ordering-ci-cd:latest
          imagePullPolicy: Always
